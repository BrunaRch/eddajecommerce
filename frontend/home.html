<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eddaj E-commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- CABEÇALHO -->
<header>
    <div class="logo">
        <img src="{% static 'images/logo.png' %}" alt="Logo da Eddaj E-commerce">
    </div>

    <div class="carrinho">
        <a href="htmlpages/login.html">Minha conta</a>
        <a href="carrinho.html">Carrinho</a>
    </div>

    <nav>
      <!--MENU DE CATEGORIAS - colares, pulseiras, aneis, pingentes, brincos, braceletes-->
      <div class="menucategorias">
        <ul>
            <li><a href="#">Colares</a></li>
            <li><a href="#">Pulseiras</a></li>
            <li><a href="#">Anéis</a></li>
            <li><a href="#">Pingentes</a></li>
            <li><a href="#">Brincos</a></li>
            <li><a href="#">Braceletes</a></li>
        </ul>
      </div>
    </nav>

<nav>
    <div class="pesquisa">
        <form action="search.html" method="get">
            <input type="text" name="query" placeholder="Pesquisar produtos...">
            <button type="submit">Pesquisar</button>
        </form>
    </div>
</nav>
</header>

<main >
<!--VITRINE-->

<section class="apresentacao">
    <h1>Bem-vindo à Eddaj E-commerce</h1>
    <p>Encontre as melhores joias e acessórios para complementar seu estilo.</p>
</section>

<section class="produtos">

    <div class="colares"></div>
    <div class="pulseiras"></div>
    <div class="aneis"></div>
    <div class="brincos"></div>
    <div class="braceletes"></div>
    <div class="pingentes"></div>
</section>

<!-- SEÇÃO DE DESTAQUES/NOVOS PRODUTOS - AINDA NÃO IMPLEMENTADA -->
<section class="destaques">
    <div class="produtos-destaque">
        <!-- Produtos em destaque serão exibidos aqui -->
    </div>
</section>
</main> 

<footer>
    <!-- SOBRE NOS, ATENDIMENTO/CONTATO -->
    <div class="copyright">
      <p>&copy; 2026 EddajECommerce. Todos os direitos reservados.</p>
    </div>
</footer>

</html>
